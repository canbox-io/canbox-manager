name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canbox-manager
        uses: actions/checkout@v4
        with:
          path: canbox-manager

      - name: Checkout canbox-core
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-core
          path: canbox-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install canbox-core dependencies
        working-directory: canbox-core
        run: npm install --production

      - name: Install canbox-manager dependencies
        working-directory: canbox-manager
        run: npm install

      - name: Build & Package (Linux)
        working-directory: canbox-manager
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canbox-linux
          path: canbox-manager/release/*.AppImage

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: canbox-manager/release/*.AppImage
          generate_release_notes: true
