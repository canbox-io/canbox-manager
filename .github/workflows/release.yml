name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '目标版本 tag（如 v0.2.7），用于手动重跑发布与 SourceForge 上传'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  release-linux:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # checkout 为同级目录，满足 build-linux.sh 中 CORE_SRC="../canbox-core" 的路径假设
      - name: Checkout canbox-manager
        uses: actions/checkout@v4
        with:
          path: canbox-manager

      - name: Checkout canbox-core
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-core
          path: canbox-core

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Detect optimal npm registry
        run: |
          if curl -s -o /dev/null -w "%{time_total}" https://registry.npmmirror.com/ | awk '{exit ($1 < 0.5) ? 0 : 1}'; then
            echo "npm_registry=https://registry.npmmirror.com/" >> $GITHUB_ENV
            echo "Using npmmirror (fast connection)"
          else
            echo "npm_registry=https://registry.npmjs.org/" >> $GITHUB_ENV
            echo "Using npm official (npmmirror slow)"
          fi

      - name: Configure npm registry
        run: npm config set registry ${{ env.npm_registry }}

      - name: Detect optimal Electron mirror
        run: |
          if curl -s -o /dev/null -w "%{time_total}" https://npmmirror.com/mirrors/electron/ | awk '{exit ($1 < 0.5) ? 0 : 1}'; then
            echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
            echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV
            echo "Using npmmirror Electron mirror (fast connection)"
          else
            echo "ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/" >> $GITHUB_ENV
            echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://github.com/electron-userland/electron-builder-binaries/releases/download/" >> $GITHUB_ENV
            echo "Using GitHub direct (npmmirror slow)"
          fi

      - name: Install canbox-core dependencies
        run: npm install --no-audit --no-fund
        working-directory: canbox-core

      - name: Install canbox-manager dependencies
        run: npm install --no-audit --no-fund
        working-directory: canbox-manager

      - name: Ensure electron binary downloaded
        run: |
          echo "=== electron package version ==="
          cat node_modules/electron/package.json | grep '"version"'
          echo "=== before: electron dist directory ==="
          ls -la node_modules/electron/dist/ 2>&1 || echo "dist directory NOT FOUND before explicit install"
          # 如果 dist 目录不存在，显式触发 electron 的 install.js
          if [ ! -d node_modules/electron/dist ]; then
            echo "=== dist not found, running electron install.js explicitly ==="
            node node_modules/electron/install.js
            echo "=== after: electron dist directory ==="
            ls -la node_modules/electron/dist/ 2>&1 || echo "dist directory STILL NOT FOUND"
          else
            echo "=== dist already exists, skip explicit install ==="
          fi
          echo "=== electron path.txt ==="
          cat node_modules/electron/path.txt 2>&1 || echo "path.txt NOT FOUND"
        working-directory: canbox-manager

      - name: Build Linux installer
        run: npm run dist:linux
        working-directory: canbox-manager

      - name: Extract changelog for this version
        id: changelog
        working-directory: canbox-manager
        run: |
          # tag 形如 v0.1.2，CHANGELOG.md 中是 ## [0.1.2]，去掉 v 前缀
          VERSION="${RELEASE_TAG#v}"
          # 提取从 "## [版本号]" 到下一个 "## [" 之间的内容
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changelog-extract.md
          echo "Extracted changelog:"
          cat changelog-extract.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: canbox-manager/release/*.sh
          body_path: canbox-manager/changelog-extract.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to SourceForge (Linux)
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          set -euo pipefail

          # === 前置校验：确认 secrets 已配置 ===
          if [ -z "$SFTP_PRIVATE_KEY" ]; then
            echo "::error::SFTP_PRIVATE_KEY secret 为空，请在仓库 Settings > Secrets > Actions 中配置"
            exit 1
          fi
          if [ -z "$SFTP_USER" ]; then
            echo "::error::SFTP_USER secret 为空，请在仓库 Settings > Secrets > Actions 中配置"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          INSTALLER="canbox-manager/release/Canbox-linux-x86_64.sh"
          SF_PATH="/home/frs/project/canbox-manager"

          mkdir -p ~/.ssh
          # 用 printf '%s' 写私钥（不加多余换行，保留原格式）
          printf '%s' "$SFTP_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null

          # === 1. 生成 latest-linux.json ===
          # releaseNotes 用 jq -Rs 安全转义多行 markdown 为 JSON 字符串
          RELEASE_NOTES_JSON=$(jq -Rs . < canbox-manager/changelog-extract.md)
          SIZE=$(stat -c%s "$INSTALLER")
          RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq -n \
            --arg version "$VERSION" \
            --arg releaseDate "$RELEASE_DATE" \
            --argjson releaseNotes "$RELEASE_NOTES_JSON" \
            --arg releaseUrl "https://github.com/canbox-io/canbox-manager/releases/tag/v${VERSION}" \
            --arg assetName "Canbox-linux-x86_64.sh" \
            --arg assetUrl "https://downloads.sourceforge.net/project/canbox-manager/v${VERSION}/Canbox-linux-x86_64.sh" \
            --argjson assetSize "$SIZE" \
            '{
              version: $version,
              releaseDate: $releaseDate,
              releaseNotes: $releaseNotes,
              releaseUrl: $releaseUrl,
              asset: {
                name: $assetName,
                url: $assetUrl,
                size: $assetSize
              }
            }' > latest-linux.json

          echo "=== latest-linux.json ==="
          cat latest-linux.json

          # === 2. SFTP 批处理：创建版本子目录并上传安装包与元数据 ===
          # frs.sourceforge.net 为受限 Shell 账户，仅允许 SFTP/SCP/Rsync 文件传输，
          # 禁止 ssh 远程命令（如 mkdir），故全部操作走 sftp 批处理；
          # 命令前加 '-' 表示忽略该命令错误（目录已存在时重跑不中断）
          printf '%s\n' \
            "-mkdir ${SF_PATH}/v${VERSION}" \
            "put ${INSTALLER} ${SF_PATH}/v${VERSION}/Canbox-linux-x86_64.sh" \
            "put latest-linux.json ${SF_PATH}/latest-linux.json" \
            | sftp -o StrictHostKeyChecking=no -o BatchMode=yes -b - \
                "${SFTP_USER},canbox-manager@frs.sourceforge.net"

  release-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # checkout 为同级目录，满足 build-win.bat 中 CORE_SRC 的路径假设
      - name: Checkout canbox-manager
        uses: actions/checkout@v4
        with:
          path: canbox-manager

      - name: Checkout canbox-core
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-core
          path: canbox-core

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure NSIS available
        shell: pwsh
        run: |
          # windows-latest (windows-2025) no longer ships NSIS preinstalled,
          # so check PATH + common locations and install via chocolatey if missing.
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe",
              "$env:LOCALAPPDATA\Programs\NSIS\makensis.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $makensis = $c; break }
            }
          }

          if (-not $makensis) {
            Write-Host "NSIS not found, installing via chocolatey..."
            $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
            foreach ($attempt in 1..3) {
              choco install nsis -y --no-progress
              if (Test-Path $nsisExe) { $makensis = $nsisExe; break }
              Write-Host "makensis.exe not found after attempt $attempt/3"
              if ($attempt -lt 3) { Start-Sleep -Seconds (30 * $attempt) }
            }
          }

          if (-not $makensis -or -not (Test-Path $makensis)) {
            Write-Error "makensis.exe not found - NSIS install failed after retries"
            exit 1
          }

          # Expose makensis to subsequent steps (build-win.bat also has fallback)
          $nsisDir = Split-Path $makensis
          if ($env:PATH -notlike "*$nsisDir*") {
            "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          Write-Host "Using makensis: $makensis"

      - name: Detect optimal npm registry
        shell: pwsh
        run: |
          $resp = Invoke-WebRequest -Uri "https://registry.npmmirror.com/" -UseBasicParsing -TimeoutSec 5 -ErrorAction SilentlyContinue
          if ($resp.StatusCode -eq 200) {
            "npm_registry=https://registry.npmmirror.com/" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using npmmirror"
          } else {
            "npm_registry=https://registry.npmjs.org/" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using npm official"
          }

      - name: Configure npm registry
        shell: pwsh
        run: npm config set registry ${{ env.npm_registry }}

      - name: Detect optimal Electron mirror
        shell: pwsh
        run: |
          $resp = Invoke-WebRequest -Uri "https://npmmirror.com/mirrors/electron/" -UseBasicParsing -TimeoutSec 5 -ErrorAction SilentlyContinue
          if ($resp.StatusCode -eq 200) {
            "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using npmmirror Electron mirror"
          } else {
            "ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ELECTRON_BUILDER_BINARIES_MIRROR=https://github.com/electron-userland/electron-builder-binaries/releases/download/" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using GitHub direct"
          }

      - name: Install canbox-core dependencies
        run: npm install --no-audit --no-fund
        working-directory: canbox-core

      - name: Install canbox-manager dependencies
        run: npm install --no-audit --no-fund
        working-directory: canbox-manager

      - name: Ensure electron binary downloaded
        shell: pwsh
        working-directory: canbox-manager
        run: |
          Write-Host "=== electron package version ==="
          (Get-Content node_modules/electron/package.json | ConvertFrom-Json).version
          Write-Host "=== before: electron dist directory ==="
          if (Test-Path node_modules/electron/dist) {
            Write-Host "dist directory exists"
          } else {
            Write-Host "dist directory NOT FOUND, running electron install.js"
            node node_modules/electron/install.js
            if (Test-Path node_modules/electron/dist) {
              Write-Host "dist directory created"
            } else {
              Write-Error "dist directory STILL NOT FOUND"
              exit 1
            }
          }

      - name: Build Windows installer
        working-directory: canbox-manager
        shell: cmd
        run: npm run dist:win

      - name: Verify installer artifact
        shell: pwsh
        working-directory: canbox-manager
        run: |
          $installer = "release\Canbox-Setup-x86_64.exe"
          Write-Host "=== Current directory: $(Get-Location) ==="
          Write-Host "=== release\ directory contents ==="
          if (Test-Path "release") {
            Get-ChildItem release -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "release\ directory DOES NOT EXIST"
          }
          Write-Host "=== All .exe files under working dir ==="
          Get-ChildItem -Path . -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== All .nsi files under working dir ==="
          Get-ChildItem -Path . -Filter "*.nsi" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== makensis location ==="
          Get-Command makensis -ErrorAction SilentlyContinue | Select-Object Source
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            exit 1
          }
          $size = (Get-Item $installer).Length / 1MB
          Write-Host ("Installer: {0} ({1:N1} MB)" -f $installer, $size)

      - name: Extract changelog for this version
        id: changelog
        working-directory: canbox-manager
        shell: pwsh
        run: |
          # tag 形如 v0.1.2，CHANGELOG.md 中是 ## [0.1.2]，去掉 v 前缀
          $version = $env:RELEASE_TAG -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw
          # 匹配 ## [版本号] 到下一个 ## [ 之间（(?m) 让 ^ 匹配行首，(?s) 让 . 匹配换行）
          $pattern = "(?ms)## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)"
          if ($content -match $pattern) {
            $matches[0] | Out-File -FilePath changelog-extract.md -Encoding utf8
          } else {
            Write-Host "No changelog section found for version $version"
            "" | Out-File -FilePath changelog-extract.md -Encoding utf8
          }
          Write-Host "Extracted changelog:"
          Get-Content changelog-extract.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: canbox-manager/release/*.exe
          body_path: canbox-manager/changelog-extract.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to SourceForge (Windows)
        # 用 bash 替代 pwsh：避免 PowerShell 把 @frs 当作 splatting 运算符
        # windows-latest 自带 Git for Windows，内含 scp/ssh
        shell: bash
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          set -euo pipefail

          # === 前置校验：确认 secrets 已配置 ===
          if [ -z "$SFTP_PRIVATE_KEY" ]; then
            echo "::error::SFTP_PRIVATE_KEY secret 为空，请在仓库 Settings > Secrets > Actions 中配置"
            exit 1
          fi
          if [ -z "$SFTP_USER" ]; then
            echo "::error::SFTP_USER secret 为空，请在仓库 Settings > Secrets > Actions 中配置"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          INSTALLER="canbox-manager/release/Canbox-Setup-x86_64.exe"
          SF_PATH="/home/frs/project/canbox-manager"

          mkdir -p ~/.ssh
          # 用 printf '%s' 写私钥（不加多余换行，保留原格式）
          printf '%s' "$SFTP_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null

          # === 1. 生成 latest-win.json ===
          # releaseNotes 用 jq -Rs 安全转义多行 markdown 为 JSON 字符串
          RELEASE_NOTES_JSON=$(jq -Rs . < canbox-manager/changelog-extract.md)
          # Git Bash 提供 GNU coreutils，stat -c%s 可用
          SIZE=$(stat -c%s "$INSTALLER")
          RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq -n \
            --arg version "$VERSION" \
            --arg releaseDate "$RELEASE_DATE" \
            --argjson releaseNotes "$RELEASE_NOTES_JSON" \
            --arg releaseUrl "https://github.com/canbox-io/canbox-manager/releases/tag/v${VERSION}" \
            --arg assetName "Canbox-Setup-x86_64.exe" \
            --arg assetUrl "https://downloads.sourceforge.net/project/canbox-manager/v${VERSION}/Canbox-Setup-x86_64.exe" \
            --argjson assetSize "$SIZE" \
            '{
              version: $version,
              releaseDate: $releaseDate,
              releaseNotes: $releaseNotes,
              releaseUrl: $releaseUrl,
              asset: {
                name: $assetName,
                url: $assetUrl,
                size: $assetSize
              }
            }' > latest-win.json

          echo "=== latest-win.json ==="
          cat latest-win.json

          # === 2. SFTP 批处理：创建版本子目录并上传安装包与元数据 ===
          # frs.sourceforge.net 为受限 Shell 账户，仅允许 SFTP/SCP/Rsync 文件传输，
          # 禁止 ssh 远程命令（如 mkdir），故全部操作走 sftp 批处理（Git for Windows 自带 sftp）；
          # 命令前加 '-' 表示忽略该命令错误（目录已存在时重跑不中断）
          printf '%s\n' \
            "-mkdir ${SF_PATH}/v${VERSION}" \
            "put ${INSTALLER} ${SF_PATH}/v${VERSION}/Canbox-Setup-x86_64.exe" \
            "put latest-win.json ${SF_PATH}/latest-win.json" \
            | sftp -o StrictHostKeyChecking=no -o BatchMode=yes -b - \
                "${SFTP_USER},canbox-manager@frs.sourceforge.net"