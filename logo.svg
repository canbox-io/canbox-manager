<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <g transform="translate(256,256)">
    <!-- 应用网格：4个圆角方块代表已安装的 APP -->
    <g fill="url(#grid)">
      <rect x="-80" y="-80" width="60" height="60" rx="14"/>
      <rect x="20" y="-80" width="60" height="60" rx="14"/>
      <rect x="-80" y="20" width="60" height="60" rx="14"/>
      <rect x="20" y="20" width="60" height="60" rx="14"/>
    </g>

    <!-- 大齿轮（管理/设置语义），叠在网格右下方 -->
    <g transform="translate(60,60)" fill="#FBBF24" opacity="0.95">
      <!-- 齿轮齿 -->
      <g>
        <rect x="-8" y="-52" width="16" height="20" rx="3"/>
        <rect x="-8" y="-52" width="16" height="20" rx="3" transform="rotate(45)"/>
        <rect x="-8" y="-52" width="16" height="20" rx="3" transform="rotate(90)"/>
        <rect x="-8" y="-52" width="16" height="20" rx="3" transform="rotate(135)"/>
        <rect x="-8" y="-52" width="16" height="20" rx="3" transform="rotate(180)"/>
        <rect x="-8" y="-52" width="16" height="20" rx="3" transform="rotate(225)"/>
        <rect x="-8" y="-52" width="16" height="20" rx="3" transform="rotate(270)"/>
        <rect x="-8" y="-52" width="16" height="20" rx="3" transform="rotate(315)"/>
      </g>
      <!-- 齿轮主体 -->
      <circle cx="0" cy="0" r="36"/>
      <!-- 中心孔 -->
      <circle cx="0" cy="0" r="14" fill="#1E40AF"/>
    </g>
  </g>
</svg>
